name: Sync upstream and rebrand fork

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream branch or tag to merge"
        required: false
        default: "main"
      dry_run:
        description: "Preview branding changes without opening a PR"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync-rebrand
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: https://github.com/yuga-hashimoto/and-code.git
  UPSTREAM_OWNER: yuga-hashimoto
  UPSTREAM_REPOSITORY_NAME: and-code
  FORK_OWNER: nastechresearch
  FORK_REPOSITORY_NAME: and-code

jobs:
  sync-and-open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream "${{ inputs.upstream_ref }}"

      - name: Create sync branch and merge upstream
        id: branch
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          branch="automation/sync-upstream-${GITHUB_RUN_ID}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git switch -c "$branch"
          # FETCH_HEAD works for both branch refs and tags. Using an assumed
          # upstream/<branch> ref would fail for a manually selected tag.
          git merge --no-edit --no-ff FETCH_HEAD -m "chore: sync upstream $UPSTREAM_REF"

      - name: Reapply fork branding
        env:
          ORIGINAL_OWNER: ${{ env.UPSTREAM_OWNER }}
          ORIGINAL_REPO: ${{ env.UPSTREAM_REPOSITORY_NAME }}
          FORK_OWNER: ${{ env.FORK_OWNER }}
          FORK_REPO: ${{ env.FORK_REPOSITORY_NAME }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          chmod +x scripts/rebrand_fork.sh
          scripts/rebrand_fork.sh

      - name: Validate no original repository links remain
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          if git grep -n -i -E 'github\.com/yuga-hashimoto(/and-code)?([/?#)]|$)' -- \
              ':(exclude).git/*' ':(exclude)docs/UPSTREAM_SYNC.md' ':(exclude)*.png' ':(exclude)*.jpg' ':(exclude)*.jpeg' \
              ':(exclude)*.gif' ':(exclude)*.webp' ':(exclude)*.mp4' ':(exclude)*.wav'; then
            echo "Original AndCode repository references remain. Review before merging." >&2
            exit 1
          fi

      - name: Commit rebrand changes
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream and rebrand fork"
          else
            echo "No rebrand file changes; upstream merge is already represented by the branch."
          fi

      - name: Push sync branch
        id: push
        if: ${{ inputs.dry_run == false }}
        run: |
          git push --set-upstream origin "${{ steps.branch.outputs.branch }}"

      - name: Open or update pull request
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number' || true)"
          title="chore: sync upstream and rebrand fork"
          body=$(cat <<EOF
          ## Upstream sync

          This PR merges \\`$UPSTREAM_REF\\` from \\`$UPSTREAM_REPOSITORY\\` and reapplies the fork branding for \\`$FORK_OWNER/$FORK_REPOSITORY_NAME\\`.

          The rebrand intentionally changes only references belonging to the original AndCode repository. External GitHub dependencies remain pointed at their real upstream projects.

          Generated by workflow run $GITHUB_RUN_ID.
          EOF
          )
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
          fi
